<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email confirmado</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f7f2;
        --card: #ffffff;
        --text: #1f2a1f;
        --ok: #1f8f45;
        --border: #d7e6d6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #e8f5e8, var(--bg));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(640px, calc(100vw - 40px));
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      .check {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        border-radius: 999px;
        background: #e8f8ee;
        border: 1px solid #b7e9c6;
        display: grid;
        place-items: center;
        color: var(--ok);
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }

      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="check">✓</div>
      <h1>Email confirmado</h1>
      <p>Ya se ha confirmado la direccion de correo electronico, por favor, cierre esta pestana. Ya puede iniciar sesion.</p>
    </main>
  </body>
</html>
